services:
  - type: web
    name: hirelens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2-preview
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: AI_DATA_POLICY
        value: demo_only
      - key: AI_REQUESTS_PER_MINUTE
        value: "8"
      - key: AI_REQUESTS_PER_DAY
        value: "100"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: HireLens <onboarding@resend.dev>
      - key: SESSION_COOKIE_SECURE
        value: "true"
